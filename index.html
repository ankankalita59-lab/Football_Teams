<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Team Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        textarea {
            width: 100%;
            max-width: 400px;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover {
            background-color: #219150;
        }
        .teams-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .team-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .team-box h2 {
            margin-top: 0;
            color: #34495e;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>

    <h1>⚽ Team Generator ⚽</h1>
    <p>Enter player names below (one per line):</p>
    
    <textarea id="playerList" placeholder="Messi&#10;Ronaldo&#10;Neymar&#10;Mbappe&#10;Haaland&#10;De Bruyne"></textarea>
    <br>
    <button onclick="generateTeams()">Shuffle & Divide</button>

    <div class="teams-container">
        <div class="team-box">
            <h2>Team A (Blue)</h2>
            <ul id="teamA"></ul>
        </div>
        <div class="team-box">
            <h2>Team B (Red)</h2>
            <ul id="teamB"></ul>
        </div>
    </div>

    <script>
        function generateTeams() {
            // 1. Get the text from the textarea
            const rawText = document.getElementById('playerList').value;
            
            // 2. Split into an array by line breaks, trim spaces, and remove empty lines
            let players = rawText.split('\n')
                                 .map(name => name.trim())
                                 .filter(name => name !== '');

            if (players.length < 2) {
                alert("Please enter at least 2 players!");
                return;
            }

            // 3. Shuffle the array randomly (Fisher-Yates Shuffle)
            for (let i = players.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [players[i], players[j]] = [players[j], players[i]]; // Swap elements
            }

            // 4. Divide into two teams
            const half = Math.ceil(players.length / 2); // Handles odd numbers (Team A gets the extra player)
            const teamA = players.slice(0, half);
            const teamB = players.slice(half);

            // 5. Display the teams on the screen
            document.getElementById('teamA').innerHTML = teamA.map(p => `<li>${p}</li>`).join('');
            document.getElementById('teamB').innerHTML = teamB.map(p => `<li>${p}</li>`).join('');
        }
    </script>

</body>
</html>
